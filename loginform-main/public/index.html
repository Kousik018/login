<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root {
    --bg: #eef2f6; --card: #ffffff; --ink: #14213d; --muted: #5b6b82;
    --line: #cdd6e2; --accent: #1f5eff; --accent-ink: #ffffff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1522; --card: #16203a; --ink: #e8eefc; --muted: #93a4c3;
            --line: #2b3a5c; --accent: #6b93ff; --accent-ink: #0e1522; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem;
         background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
         border-radius: 12px; padding: 1.75rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.25rem; color: var(--muted); }
  .tabs { display: flex; gap: .25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; padding: .6rem; font: inherit; color: var(--muted);
                 cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  label { display: block; font-size: .9rem; margin: .9rem 0 .3rem; }
  input { width: 100%; padding: .65rem .75rem; font: inherit; color: var(--ink); background: transparent;
          border: 1px solid var(--line); border-radius: 8px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .submit { width: 100%; margin-top: 1.25rem; padding: .75rem; font: inherit; font-weight: 600;
            background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; cursor: pointer; }
  .submit:disabled { opacity: .6; cursor: progress; }
  #msg { min-height: 1.4rem; margin: .9rem 0 0; font-size: .9rem; color: var(--err); }
  #msg.ok { color: var(--muted); }
  [hidden] { display: none; }
  #welcome button { margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <section id="auth">
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="sub">Log in to continue.</p>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true">Log in</button>
      <button role="tab" id="tab-signup" aria-selected="false">Sign up</button>
    </div>
    <form id="form" novalidate>
      <div id="name-wrap" hidden>
        <label for="name">Name</label>
        <input id="name" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>
      <button class="submit" id="submit" type="submit">Log in</button>
      <p id="msg" role="alert"></p>
    </form>
  </section>

  <section id="welcome" hidden>
    <h1 id="hello"></h1>
    <p class="sub" id="who"></p>
    <button class="submit" id="logout" type="button">Log out</button>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
